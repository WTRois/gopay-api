version: "3.8"

services:
  gopay-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gopay-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.GOPAY_SESI_JANGAN_DIHAPUS.json:/app/.GOPAY_SESI_JANGAN_DIHAPUS.json
    healthcheck:
      test: ["CMD", "bun", "run", "src/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
